name: build-and-test

on:
  push:
    branches-ignore:
      - "dependabot/**"
      - "gh-pages"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  validate-dotnet:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Release, ReleaseLean]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.4.x"

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.configuration }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.configuration }}-nuget-
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Trailblazer.slnx --property:Configuration=${{ matrix.configuration }}

      - name: Build Solution
        run: |
          echo "Version: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "Assembly Version: ${{ steps.gitversion.outputs.assemblySemFileVer }}"
          dotnet build Trailblazer.slnx --configuration ${{ matrix.configuration }} --no-restore -p:GitVersion_FullSemVer=${{ steps.gitversion.outputs.fullSemVer }} -p:GitVersion_AssemblySemVer=${{ steps.gitversion.outputs.assemblySemVer }} -p:GitVersion_AssemblySemFileVer=${{ steps.gitversion.outputs.assemblySemFileVer }}

      - name: Run Tests
        if: matrix.os == 'windows-latest'
        run: dotnet test Trailblazer.slnx --configuration ${{ matrix.configuration }} --no-build --verbosity normal

      - name: Run Tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet test tests/Trailblazer.Tests/Trailblazer.Tests.csproj --configuration ${{ matrix.configuration }} --no-build --verbosity normal --settings tests/Trailblazer.Tests/coverlet.runsettings --results-directory artifacts/coverage/core
          dotnet test tests/Trailblazer.Gravitas.Tests/Trailblazer.Gravitas.Tests.csproj --configuration ${{ matrix.configuration }} --no-build --verbosity normal --settings tests/Trailblazer.Gravitas.Tests/coverlet.runsettings --results-directory artifacts/coverage/adapter

      - name: Install ReportGenerator
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Add ReportGenerator to PATH
        if: matrix.os == 'ubuntu-latest'
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate exact coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          reportgenerator \
            "-reports:artifacts/coverage/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage-report" \
            "-reporttypes:JsonSummary"

      - name: Enforce exact coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          jq -e '
            ([.coverage.assemblies[].name] | sort) == ["Trailblazer", "Trailblazer.Gravitas"] and
            (all(.coverage.assemblies[]; .coverage > 0)) and
            .summary.coveredlines == .summary.coverablelines and
            .summary.coveredbranches == .summary.totalbranches and
            .summary.coveredmethods == .summary.totalmethods and
            .summary.fullcoveredmethods == .summary.totalmethods
          ' artifacts/coverage-report/Summary.json
