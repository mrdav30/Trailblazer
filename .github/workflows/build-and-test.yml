name: build-and-test

on:
  push:
    branches-ignore:
      - "dependabot/**"
      - "gh-pages"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "develop"

permissions:
  contents: read

jobs:
  validate-dotnet:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Trailblazer
    env:
      # PRs follow their target branch so develop -> main validates released packages.
      UseLocalLsfStack: ${{ (github.base_ref == 'develop' || github.ref == 'refs/heads/develop') && 'true' || 'false' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Release, ReleaseLean]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: Trailblazer
          fetch-depth: 0
          persist-credentials: false

      # Keep the dependency closure aligned with the pinned Gravitas workflow.
      - name: Checkout Chronicler
        if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/Chronicler
          ref: 7b90d5923d4bb6e0e42c033ec697b9678d6b8ece
          path: Chronicler
          persist-credentials: false

      - name: Checkout FixedMathSharp
        if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/FixedMathSharp
          ref: 8fdf889322f1bb82501c2afec63d6bb2f304ace2
          path: FixedMathSharp
          persist-credentials: false

      - name: Checkout SwiftCollections
        if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/SwiftCollections
          ref: 7c2fa696f10d88194f5a895aaafd7debd8e27574
          path: SwiftCollections
          persist-credentials: false

      - name: Checkout GridForge
        if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/GridForge
          ref: dc1f3fb03d642e6c0db3ea3b5302f0dbfa1bd4a4
          path: GridForge
          persist-credentials: false

      - name: Checkout Gravitas
        if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/Gravitas
          ref: 9c372a74274022d9a737cb1747a014c44b4b9732
          path: Gravitas
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.4.x"

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          targetPath: Trailblazer

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.configuration }}-lsf-${{ env.UseLocalLsfStack }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.configuration }}-lsf-${{ env.UseLocalLsfStack }}-nuget-
            ${{ runner.os }}-lsf-${{ env.UseLocalLsfStack }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Trailblazer.slnx --property:Configuration=${{ matrix.configuration }} -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} ${{ env.UseLocalLsfStack == 'true' && '-p:DisableTransitiveProjectReferences=true -m:1' || '' }}

      - name: Build Solution
        run: |
          echo "Version: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "Assembly Version: ${{ steps.gitversion.outputs.assemblySemFileVer }}"
          dotnet build Trailblazer.slnx --configuration ${{ matrix.configuration }} --no-restore -p:GitVersion_FullSemVer=${{ steps.gitversion.outputs.fullSemVer }} -p:GitVersion_AssemblySemVer=${{ steps.gitversion.outputs.assemblySemVer }} -p:GitVersion_AssemblySemFileVer=${{ steps.gitversion.outputs.assemblySemFileVer }} -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} ${{ env.UseLocalLsfStack == 'true' && '-p:DisableTransitiveProjectReferences=true -m:1 -p:BuildInParallel=false' || '' }}

      - name: Run Tests with coverage
        shell: pwsh
        run: |
          dotnet test tests/Trailblazer.Tests/Trailblazer.Tests.csproj --configuration ${{ matrix.configuration }} --no-build --no-restore -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} ${{ env.UseLocalLsfStack == 'true' && '-p:DisableTransitiveProjectReferences=true' || '' }} --verbosity normal --collect:"XPlat Code Coverage" --settings tests/Trailblazer.Tests/coverlet.runsettings --results-directory artifacts/coverage/core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Trailblazer.Gravitas.Tests/Trailblazer.Gravitas.Tests.csproj --configuration ${{ matrix.configuration }} --no-build --no-restore -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} ${{ env.UseLocalLsfStack == 'true' && '-p:DisableTransitiveProjectReferences=true' || '' }} --verbosity normal --collect:"XPlat Code Coverage" --settings tests/Trailblazer.Gravitas.Tests/coverlet.runsettings --results-directory artifacts/coverage/adapter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce full coverage
        shell: pwsh
        run: ./.assets/scripts/assert-full-coverage.ps1 -CoverageDirectory artifacts/coverage
