name: build-and-test

on:
  push:
    branches-ignore:
      - "dependabot/**"
      - "gh-pages"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "develop"

permissions:
  contents: read

jobs:
  validate-dotnet:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Trailblazer
    env:
      # PRs follow their target branch so develop -> main validates released packages.
      UseLocalLsfStack: ${{ (github.base_ref == 'develop' || github.ref == 'refs/heads/develop') && 'true' || 'false' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Release, ReleaseLean]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: Trailblazer
          fetch-depth: 0
          persist-credentials: false

      # Keep the dependency closure aligned with the pinned Gravitas workflow.
      - name: Checkout Chronicler
        if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/Chronicler
          ref: 7b90d5923d4bb6e0e42c033ec697b9678d6b8ece
          path: Chronicler
          persist-credentials: false

      - name: Checkout FixedMathSharp
        if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/FixedMathSharp
          ref: e2c325a827506419b1a04b2427d9bc77e629ab6f
          path: FixedMathSharp
          persist-credentials: false

      - name: Checkout SwiftCollections
        if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/SwiftCollections
          ref: 08b1b386353c66c7fa5d96a9c3e453eb19b9e39f
          path: SwiftCollections
          persist-credentials: false

      - name: Checkout GridForge
        if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/GridForge
          ref: 269da48a6e85a37eff2a1acc5b4c9f9ab632587e
          path: GridForge
          persist-credentials: false

      - name: Checkout Gravitas
        if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/Gravitas
          ref: cd1b832272bdc28d4b57b4f11b073053c0341f2d
          path: Gravitas
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.4.x"

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          targetPath: Trailblazer

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.configuration }}-lsf-${{ env.UseLocalLsfStack }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.configuration }}-lsf-${{ env.UseLocalLsfStack }}-nuget-
            ${{ runner.os }}-lsf-${{ env.UseLocalLsfStack }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Trailblazer.slnx --property:Configuration=${{ matrix.configuration }} -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} ${{ env.UseLocalLsfStack == 'true' && '-p:DisableTransitiveProjectReferences=true -m:1' || '' }}

      - name: Build Solution
        run: |
          echo "Version: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "Assembly Version: ${{ steps.gitversion.outputs.assemblySemFileVer }}"
          dotnet build Trailblazer.slnx --configuration ${{ matrix.configuration }} --no-restore -p:GitVersion_FullSemVer=${{ steps.gitversion.outputs.fullSemVer }} -p:GitVersion_AssemblySemVer=${{ steps.gitversion.outputs.assemblySemVer }} -p:GitVersion_AssemblySemFileVer=${{ steps.gitversion.outputs.assemblySemFileVer }} -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} ${{ env.UseLocalLsfStack == 'true' && '-p:DisableTransitiveProjectReferences=true -m:1 -p:BuildInParallel=false' || '' }}

      - name: Run Tests
        if: matrix.os == 'windows-latest'
        run: dotnet test Trailblazer.slnx --configuration ${{ matrix.configuration }} --no-build --no-restore -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} ${{ env.UseLocalLsfStack == 'true' && '-p:DisableTransitiveProjectReferences=true' || '' }} --verbosity normal

      - name: Run Tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet test tests/Trailblazer.Tests/Trailblazer.Tests.csproj --configuration ${{ matrix.configuration }} --no-build --no-restore -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} ${{ env.UseLocalLsfStack == 'true' && '-p:DisableTransitiveProjectReferences=true' || '' }} --verbosity normal --settings tests/Trailblazer.Tests/coverlet.runsettings --results-directory artifacts/coverage/core
          dotnet test tests/Trailblazer.Gravitas.Tests/Trailblazer.Gravitas.Tests.csproj --configuration ${{ matrix.configuration }} --no-build --no-restore -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} ${{ env.UseLocalLsfStack == 'true' && '-p:DisableTransitiveProjectReferences=true' || '' }} --verbosity normal --settings tests/Trailblazer.Gravitas.Tests/coverlet.runsettings --results-directory artifacts/coverage/adapter

      - name: Install ReportGenerator
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Add ReportGenerator to PATH
        if: matrix.os == 'ubuntu-latest'
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate exact coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          reportgenerator \
            "-reports:artifacts/coverage/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage-report" \
            "-reporttypes:JsonSummary"

      - name: Enforce exact coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          jq -e '
            ([.coverage.assemblies[].name] | sort) == ["Trailblazer", "Trailblazer.Gravitas"] and
            (all(.coverage.assemblies[]; .coverage > 0)) and
            .summary.coveredlines == .summary.coverablelines and
            .summary.coveredbranches == .summary.totalbranches and
            .summary.coveredmethods == .summary.totalmethods and
            .summary.fullcoveredmethods == .summary.totalmethods
          ' artifacts/coverage-report/Summary.json
